name: Build docs and deploy GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs builder
        run: python -m pip install -r docs/requirements.txt

      - name: Render SPEC.md into the docs website
        run: python tools/build_docs.py --output _site --clean

      # _site is only a disposable artifact: docs/ remains the website source.
      # Every branch push, tag push, and pull request keeps a downloadable build.
      - name: Upload docs build
        uses: actions/upload-artifact@v4
        with:
          name: rumi-docs-${{ github.run_id }}
          path: _site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

      - name: Upload Pages artifact
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
