name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # build and test every artifact without publishing

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - id: version
        name: Check VERSION, changelog, dependencies, and tag
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args=(--tag "$GITHUB_REF")
          fi
          python tools/check_release.py "${args[@]}"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  # Match GeoZL/OpenZL wheel support. Linux targets manylinux_2_28.
  build-lib-linux:
    name: librumi (linux-x86_64)
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Init native dependencies
        run: |
          git -C extern/geozl submodule update --init extern/openzl
          git -C extern/geozl/extern/openzl submodule update --init deps/zstd deps/lz4
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: build
          create-args: >-
            python=3.12
            cmake
            ninja
            make
            libcurl=8.22.0
            openssl=3.6.4
      - name: Build pinned static libcurl
        shell: bash -el {0}
        run: bash tools/build_static_curl.sh "$RUNNER_TEMP/curl"
      - name: Build and stage library
        shell: bash -el {0}
        run: |
          set -euo pipefail
          make stage-lib STAGE_DIR=staged \
            CMAKE_FLAGS="-DCURL_ROOT=$RUNNER_TEMP/curl \
            -DCURL_DIR=$RUNNER_TEMP/curl/lib/cmake/CURL \
            -DOPENSSL_ROOT_DIR=$CONDA_PREFIX"
          if readelf -d staged/librumi.so | grep -q 'libcurl'; then
            echo '::error::Linux librumi must not depend on shared libcurl'
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librumi-linux-x86_64
          path: staged/
          if-no-files-found: error

  build-lib-macos:
    name: librumi (macos-arm64)
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Init native dependencies
        run: |
          git -C extern/geozl submodule update --init extern/openzl
          git -C extern/geozl/extern/openzl submodule update --init deps/zstd deps/lz4
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: build
          create-args: >-
            python=3.12
            cmake
            ninja
            make
            libcurl=8.22.0
            openssl=3.6.4
      - name: Build and stage library
        shell: bash -el {0}
        run: >-
          make stage-lib STAGE_DIR=staged
          CMAKE_FLAGS="-DCURL_ROOT=$CONDA_PREFIX
          -DOPENSSL_ROOT_DIR=$CONDA_PREFIX"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librumi-macos-arm64
          path: staged/
          if-no-files-found: error

  build-wheel-linux:
    name: Wheel (linux-x86_64)
    needs: [validate, build-lib-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: build
          create-args: >-
            python=3.12
            openssl=3.6.4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librumi-linux-x86_64
          path: lib-bin/
      - name: Bundle native library
        shell: bash -el {0}
        run: |
          mkdir -p bindings/python/rumi/_lib
          cp -av lib-bin/librumi* bindings/python/rumi/_lib/
      - name: Build and repair wheel
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python -m pip install -q build hatchling cffi wheel auditwheel
          python -m build --wheel --outdir wheelhouse-raw bindings/python
          python -m wheel tags --python-tag py3 --abi-tag none \
            --remove wheelhouse-raw/*.whl
          mkdir -p wheelhouse
          compiler_runtime=$(dirname "$(g++ -print-file-name=libstdc++.so.6)")
          LD_LIBRARY_PATH="$compiler_runtime:$CONDA_PREFIX/lib" \
            auditwheel repair -w wheelhouse wheelhouse-raw/*.whl
          python bindings/python/check_wheel.py wheelhouse/*.whl
      - name: Test installed wheel
        shell: bash
        env:
          LD_LIBRARY_PATH: ''
        run: |
          /opt/python/cp312-cp312/bin/python -m venv /tmp/rumi-wheel-test
          source /tmp/rumi-wheel-test/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install wheelhouse/*.whl
          python -m pip install -q pytest "geozl>=0.16.0,<0.17"
          python bindings/python/tests/smoke.py
          python -m pytest bindings/python/tests -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-linux-x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error

  test-wheel-linux:
    name: Wheel portability (Ubuntu)
    needs: build-wheel-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel-linux-x86_64
          path: wheelhouse/
      - name: Read a remote fixture without a CA override
        run: |
          python -m venv /tmp/rumi-portability-test
          source /tmp/rumi-portability-test/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install wheelhouse/*.whl
          env -u KARU_HTTP_CA_BUNDLE -u CURL_CA_BUNDLE -u SSL_CERT_FILE \
            python - <<'PY'
          import rumi

          path = (
              "hf://datasets/asterisk-labs/rumi-api-fixtures/"
              "data/era5-t2m-00-time.rumi"
          )
          metadata = rumi.info(source=path)
          data = rumi.read(
              path, metadata.header, time=[0], window=(0, 0, 1, 1)
          )
          assert metadata.shape == (24, 1, 721, 1440)
          assert data.shape == (1, 1, 1, 1)
          PY

  build-wheel-macos:
    name: Wheel (macos-arm64)
    needs: [validate, build-lib-macos]
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: wheel
          create-args: >-
            python=3.12
            libcurl=8.22.0
            openssl=3.6.4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librumi-macos-arm64
          path: lib-bin/
      - name: Bundle native library
        run: |
          mkdir -p bindings/python/rumi/_lib
          cp -av lib-bin/librumi* bindings/python/rumi/_lib/
      - name: Build and repair wheel
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip build hatchling cffi wheel delocate
          python -m build --wheel --outdir wheelhouse-raw bindings/python
          mkdir -p wheelhouse
          DYLD_LIBRARY_PATH="$CONDA_PREFIX/lib" \
            delocate-wheel -w wheelhouse wheelhouse-raw/*.whl
          python -m wheel tags --python-tag py3 --abi-tag none \
            --platform-tag macosx_11_0_arm64 --remove wheelhouse/*.whl
          python bindings/python/check_wheel.py wheelhouse/*.whl
      - name: Test installed wheel
        shell: bash -el {0}
        run: |
          python -m venv /tmp/rumi-wheel-test
          source /tmp/rumi-wheel-test/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install wheelhouse/*.whl
          python -m pip install -q pytest "geozl>=0.16.0,<0.17"
          python bindings/python/tests/smoke.py
          python -m pytest bindings/python/tests -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-macos-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error

  check-wheels:
    name: Check release wheels
    needs: [test-wheel-linux, build-wheel-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: wheels/
          merge-multiple: true
      - name: Check contents and supported platform tags
        run: |
          python bindings/python/check_wheel.py wheels/*.whl
          python - <<'PY'
          import glob
          import re
          import sys

          wheels = [path.split('/')[-1] for path in glob.glob('wheels/*.whl')]
          ok = True

          targets = {
              'linux x86_64': lambda name: (
                  'manylinux' in name and name.endswith('x86_64.whl')
              ),
              'macos arm64': lambda name: (
                  'macosx_11_0_arm64' in name and name.endswith('arm64.whl')
              ),
          }
          for label, predicate in targets.items():
              if not any(predicate(name) for name in wheels):
                  print(f'::error::missing wheel for {label}')
                  ok = False

          for name in wheels:
              match = re.search(r'manylinux_(\d+)_(\d+)_', name)
              if match and (int(match[1]), int(match[2])) > (2, 28):
                  print(f'::error::{name} requires glibc newer than 2.28')
                  ok = False

          print('found:', *('  ' + name for name in wheels), sep='\n')
          sys.exit(0 if ok else 1)
          PY

  gh-release:
    name: GitHub Release
    needs:
      - validate
      - build-lib-linux
      - build-lib-macos
      - check-wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: librumi-*
          path: artifacts/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: wheels/
          merge-multiple: true
      - name: Re-pack versioned native archives
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          mkdir -p release-files
          for platform_dir in artifacts/librumi-*; do
            platform=$(basename "$platform_dir" | sed 's/^librumi-//')
            package="librumi-${version}-${platform}"
            (cd "$platform_dir" && tar czf "$OLDPWD/release-files/${package}.tar.gz" .)
          done
          ls -l release-files/ wheels/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            release-files/*
            wheels/*.whl
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheel-linux, build-wheel-macos, check-wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      - run: ls -l dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
