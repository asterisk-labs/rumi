name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:        # build and test every artifact without publishing

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - id: version
        name: Check VERSION, changelog, GeoZL, and tag
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args=(--tag "$GITHUB_REF")
          fi
          python tools/check_release.py "${args[@]}"
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  # Match GeoZL/OpenZL wheel support. Linux targets manylinux_2_28.
  build-lib-linux:
    name: librumi (linux-x86_64)
    needs: validate
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Init native dependencies
        run: |
          git -C extern/geozl submodule update --init extern/openzl
          git -C extern/geozl/extern/openzl submodule update --init deps/zstd deps/lz4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          create-args: >-
            python=3.12
            cmake
            ninja
            make
      - name: Build and stage library
        shell: bash -el {0}
        run: make stage-lib STAGE_DIR=staged
      - uses: actions/upload-artifact@v7
        with:
          name: librumi-linux-x86_64
          path: staged/
          if-no-files-found: error

  build-lib-macos:
    name: librumi (macos-arm64)
    needs: validate
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Init native dependencies
        run: |
          git -C extern/geozl submodule update --init extern/openzl
          git -C extern/geozl/extern/openzl submodule update --init deps/zstd deps/lz4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          create-args: >-
            python=3.12
            cmake
            ninja
            make
      - name: Build and stage library
        shell: bash -el {0}
        run: make stage-lib STAGE_DIR=staged
      - uses: actions/upload-artifact@v7
        with:
          name: librumi-macos-arm64
          path: staged/
          if-no-files-found: error

  build-wheel-linux:
    name: Wheel (linux-x86_64)
    needs: [validate, build-lib-linux]
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          create-args: python=3.12
      - uses: actions/download-artifact@v8
        with:
          name: librumi-linux-x86_64
          path: lib-bin/
      - name: Bundle native library
        shell: bash -el {0}
        run: |
          mkdir -p bindings/python/rumi/_lib
          cp -av lib-bin/librumi* bindings/python/rumi/_lib/
      - name: Build and repair wheel
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python -m pip install -q build hatchling cffi wheel auditwheel
          python -m build --wheel --outdir wheelhouse-raw bindings/python
          python -m wheel tags --python-tag py3 --abi-tag none \
            --remove wheelhouse-raw/*.whl
          mkdir -p wheelhouse
          auditwheel repair -w wheelhouse wheelhouse-raw/*.whl
          python bindings/python/check_wheel.py wheelhouse/*.whl
      - name: Test installed wheel
        shell: bash
        env:
          LD_LIBRARY_PATH: ''
        run: |
          /opt/python/cp312-cp312/bin/python -m venv /tmp/rumi-wheel-test
          source /tmp/rumi-wheel-test/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install wheelhouse/*.whl
          python -m pip install -q pytest "geozl>=0.14.0,<0.15"
          python bindings/python/tests/smoke.py
          python -m pytest bindings/python/tests -q
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-x86_64
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-wheel-macos:
    name: Wheel (macos-arm64)
    needs: [validate, build-lib-macos]
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: librumi-macos-arm64
          path: lib-bin/
      - name: Bundle native library
        run: |
          mkdir -p bindings/python/rumi/_lib
          cp -av lib-bin/librumi* bindings/python/rumi/_lib/
      - name: Build and repair wheel
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip build hatchling cffi wheel delocate
          python -m build --wheel --outdir wheelhouse-raw bindings/python
          mkdir -p wheelhouse
          delocate-wheel -w wheelhouse wheelhouse-raw/*.whl
          python -m wheel tags --python-tag py3 --abi-tag none \
            --platform-tag macosx_11_0_arm64 --remove wheelhouse/*.whl
          python bindings/python/check_wheel.py wheelhouse/*.whl
      - name: Test installed wheel
        run: |
          python -m venv /tmp/rumi-wheel-test
          source /tmp/rumi-wheel-test/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install wheelhouse/*.whl
          python -m pip install -q pytest "geozl>=0.14.0,<0.15"
          python bindings/python/tests/smoke.py
          python -m pytest bindings/python/tests -q
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error

  check-wheels:
    name: Check release wheels
    needs: [build-wheel-linux, build-wheel-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: wheels/
          merge-multiple: true
      - name: Check contents and supported platform tags
        run: |
          python bindings/python/check_wheel.py wheels/*.whl
          python - <<'PY'
          import glob
          import re
          import sys

          wheels = [path.split('/')[-1] for path in glob.glob('wheels/*.whl')]
          ok = True

          targets = {
              'linux x86_64': lambda name: (
                  'manylinux' in name and name.endswith('x86_64.whl')
              ),
              'macos arm64': lambda name: (
                  'macosx_11_0_arm64' in name and name.endswith('arm64.whl')
              ),
          }
          for label, predicate in targets.items():
              if not any(predicate(name) for name in wheels):
                  print(f'::error::missing wheel for {label}')
                  ok = False

          for name in wheels:
              match = re.search(r'manylinux_(\d+)_(\d+)_', name)
              if match and (int(match[1]), int(match[2])) > (2, 28):
                  print(f'::error::{name} requires glibc newer than 2.28')
                  ok = False

          print('found:', *('  ' + name for name in wheels), sep='\n')
          sys.exit(0 if ok else 1)
          PY

  gh-release:
    name: GitHub Release
    needs:
      - validate
      - build-lib-linux
      - build-lib-macos
      - check-wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: librumi-*
          path: artifacts/
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: wheels/
          merge-multiple: true
      - name: Re-pack versioned native archives
        run: |
          set -euo pipefail
          version="${{ needs.validate.outputs.version }}"
          mkdir -p release-files
          for platform_dir in artifacts/librumi-*; do
            platform=$(basename "$platform_dir" | sed 's/^librumi-//')
            package="librumi-${version}-${platform}"
            (cd "$platform_dir" && tar czf "$OLDPWD/release-files/${package}.tar.gz" .)
          done
          ls -l release-files/ wheels/
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release-files/*
            wheels/*.whl
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheel-linux, build-wheel-macos, check-wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      - run: ls -l dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
