name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag must equal VERSION
        run: |
          VERSION_FILE=$(tr -d '[:space:]' < VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
            if [ "$VERSION_FILE" != "$TAG_VERSION" ]; then
              echo "::error::Tag v$TAG_VERSION does not match VERSION ($VERSION_FILE)"
              exit 1
            fi
            echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION_FILE" >> "$GITHUB_OUTPUT"
          fi

  # Only the platforms geozl publishes wheels for. Without geozl nobody can
  # produce the compressed tiles rumi writes, so a Windows wheel would ship a
  # library that can read but never author.
  # Linux builds run in manylinux_2_28 so the binary is compiled against old glibc.
  build-lib-linux:
    name: librumi (${{ matrix.name }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true            # brings extern/geozl, not its nested submodules
      - name: Init geozl and OpenZL deps (zstd, lz4 only, no xgboost)
        run: |
          git -C extern/geozl submodule update --init extern/openzl
          git -C extern/geozl/extern/openzl submodule update --init deps/zstd deps/lz4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          create-args: >-
            python=3.12
            cmake
            ninja
            make
      - name: Build lib
        shell: bash -el {0}
        run: make lib
      - name: Stage lib for artifact
        shell: bash -el {0}
        run: make stage-lib STAGE_DIR=staged
      - uses: actions/upload-artifact@v4
        with:
          name: librumi-${{ matrix.name }}
          path: staged/
          if-no-files-found: error

  build-lib-macos:
    name: librumi (macos-arm64)
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Init geozl and OpenZL deps (zstd, lz4 only, no xgboost)
        run: |
          git -C extern/geozl submodule update --init extern/openzl
          git -C extern/geozl/extern/openzl submodule update --init deps/zstd deps/lz4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          create-args: >-
            python=3.12
            cmake
            ninja
            make
      - name: Build lib
        shell: bash -el {0}
        run: make lib
      - name: Stage lib for artifact
        shell: bash -el {0}
        run: make stage-lib STAGE_DIR=staged
      - uses: actions/upload-artifact@v4
        with:
          name: librumi-macos-arm64
          path: staged/
          if-no-files-found: error

  build-wheel-linux:
    name: Wheel (${{ matrix.name }})
    needs: [validate, build-lib-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          create-args: >-
            python=3.12
      - uses: actions/download-artifact@v4
        with:
          name: librumi-${{ matrix.name }}
          path: lib-bin/
      - name: Bundle native lib
        shell: bash -el {0}
        run: |
          mkdir -p bindings/python/rumi/_lib
          cp -a lib-bin/* bindings/python/rumi/_lib/
      - name: Build wheel
        shell: bash -el {0}
        working-directory: bindings/python
        run: |
          python -m pip install build hatchling cffi wheel
          python -m build --wheel --outdir ../../wheelhouse-raw
      - name: Normalise wheel tags
        # cffi ABI mode: rumi ships no compiled extension, it dlopens librumi at
        # runtime, so the wheel is py3-none-<platform>, not bound to a CPython ABI.
        # The platform tag is set later, off the real glibc floor of the binaries.
        shell: bash -el {0}
        run: python -m wheel tags --python-tag py3 --abi-tag none --remove wheelhouse-raw/*.whl
      - name: Repair wheel
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python -m pip install auditwheel wheel

          # Read the floor off auditwheel's "platform tag" line, not the max in the report.
          floor_of() {
            auditwheel show "$1" 2>/dev/null | grep -iE 'platform tag' \
              | grep -oE 'manylinux_[0-9]+_[0-9]+_[a-z0-9_]+' \
              | sort -t_ -k2,2n -k3,3n | head -1
          }

          plat=$(floor_of wheelhouse-raw/*.whl)
          mkdir -p wheelhouse
          auditwheel repair ${plat:+--plat "$plat"} -w wheelhouse wheelhouse-raw/*.whl
          ls -1 wheelhouse/
      - name: Install, smoke-test and run the suite
        # A bare manylinux python with no conda on the path, so the wheel stands
        # alone the way a user install would.
        shell: bash
        env:
          LD_LIBRARY_PATH: ""
        run: |
          /opt/python/cp312-cp312/bin/python -m venv /tmp/clean
          source /tmp/clean/bin/activate
          python -m pip install --upgrade pip
          python -m pip install wheelhouse/*.whl
          python -m pip install pytest "geozl>=0.12"
          python bindings/python/tests/smoke.py
          python -m pytest bindings/python/tests -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build-wheel-macos:
    name: Wheel (macos-arm64)
    needs: [validate, build-lib-macos]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build hatchling cffi wheel
      - uses: actions/download-artifact@v4
        with:
          name: librumi-macos-arm64
          path: lib-bin/
      - name: Bundle native lib
        shell: bash
        run: |
          mkdir -p bindings/python/rumi/_lib
          cp -a lib-bin/* bindings/python/rumi/_lib/
      - name: Build wheel
        working-directory: bindings/python
        run: python -m build --wheel --outdir ../../wheelhouse-raw
      - name: Normalise wheel tags
        shell: bash
        run: |
          python -m wheel tags --python-tag py3 --abi-tag none \
            --platform-tag macosx_14_0_arm64 --remove wheelhouse-raw/*.whl
      - name: Stage the wheel
        shell: bash
        run: |
          mkdir -p wheelhouse
          cp wheelhouse-raw/*.whl wheelhouse/
      - name: Install, smoke-test and run the suite
        shell: bash
        run: |
          python -m venv /tmp/clean
          source /tmp/clean/bin/activate
          python -m pip install --upgrade pip
          python -m pip install wheelhouse/*.whl
          python -m pip install pytest "geozl>=0.12"
          python bindings/python/tests/smoke.py
          python -m pytest bindings/python/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-arm64
          path: wheelhouse/*.whl
          if-no-files-found: error

  check-wheels:
    name: Check wheel platform tags
    # Block the release if a platform's wheel is missing, or if a manylinux wheel
    # floors above glibc 2.28, which would leave older hosts unable to install it.
    # The tag is not only about glibc. auditwheel raises it for a libstdc++
    # symbol too, so a single std::string concatenation in librumi can push a
    # wheel several policies up and fail here.
    needs: [build-wheel-linux, build-wheel-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: wheels/
          merge-multiple: true
      - name: Assert tags
        run: |
          ls -1 wheels/
          python - <<'PY'
          import glob, re, sys
          wheels = [w.split("/")[-1] for w in glob.glob("wheels/*.whl")]
          ok = True

          def floor(name):
              m = re.search(r"manylinux_(\d+)_(\d+)_", name)
              return (int(m.group(1)), int(m.group(2))) if m else None

          targets = {
              "linux x86_64":  lambda n: "manylinux" in n and n.endswith("x86_64.whl"),
              "linux aarch64": lambda n: "manylinux" in n and n.endswith("aarch64.whl"),
              "macos arm64":   lambda n: "macosx" in n and n.endswith("arm64.whl"),
          }
          for label, pred in targets.items():
              if not any(pred(n) for n in wheels):
                  print(f"::error::missing wheel for {label}")
                  ok = False

          for n in wheels:
              f = floor(n)
              if f and f > (2, 28):
                  print(f"::error::{n} floors at glibc {f[0]}.{f[1]}, above 2.28. "
                        "Run `auditwheel show` on it: the tag is driven by the "
                        "highest GLIBC, GLIBCXX or CXXABI symbol it references.")
                  ok = False

          print("found:", *("  " + n for n in wheels), sep="\n")
          sys.exit(0 if ok else 1)
          PY

  build-sdist:
    name: sdist
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - working-directory: bindings/python
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir ../../sdist-out
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: sdist-out/*.tar.gz
          if-no-files-found: error

  gh-release:
    name: GitHub Release
    # Ships the raw librumi C libraries per platform, for consumers that link rumi
    # directly. The Python wheels and sdist go to PyPI in publish-pypi, not here.
    needs: [validate, build-lib-linux, build-lib-macos, build-wheel-linux, build-wheel-macos, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: librumi-*
          path: artifacts/
      - name: Re-pack into versioned archives
        run: |
          set -euo pipefail
          VERSION="${{ needs.validate.outputs.version }}"
          mkdir -p release-files
          for plat_dir in artifacts/librumi-*; do
            plat=$(basename "$plat_dir" | sed 's/^librumi-//')
            pkg="librumi-${VERSION}-${plat}"
            (cd "$plat_dir" && tar czf "$OLDPWD/release-files/${pkg}.tar.gz" .)
          done
          ls -1 release-files/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

  # Trusted publishing (OIDC): needs the `pypi` environment + a PyPI pending publisher.
  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheel-linux, build-wheel-macos, build-sdist, check-wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: ls -la dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
