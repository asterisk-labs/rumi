name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Test
        run: make js-install js-test
      - name: Check package contents
        working-directory: bindings/javascript
        run: npm pack --dry-run

  r-julia:
    name: R and Julia (Julia ${{ matrix.julia }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Init OpenZL dependencies
        run: |
          git -C extern/geozl submodule update --init extern/openzl
          git -C extern/geozl/extern/openzl submodule update --init deps/zstd deps/lz4
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: bindings
          create-args: >-
            python=3.12
            cmake
            ninja
            pkg-config
            r-base=4.5
            r-roxygen2
            r-testthat
            julia=${{ matrix.julia }}
            libcurl=8.22.0
            openssl=3.6.4
            libopenssl-static=3.6.4
      # The fixtures are written with the GeoZL binding built from extern/geozl.
      - name: Install Python fixture dependencies
        shell: bash -el {0}
        run: python -m pip install numpy cffi
      - name: Test R and Julia readers
        shell: bash -el {0}
        run: make bindings-test
      - name: Check R documentation
        if: matrix.julia == '1.12'
        shell: bash -el {0}
        run: |
          Rscript -e 'roxygen2::roxygenise("bindings/r")'
          git diff --exit-code -- bindings/r/NAMESPACE bindings/r/man
      - name: Check R source package
        if: matrix.julia == '1.12'
        shell: bash -el {0}
        run: make r-check
      - name: Test Julia artifact loading
        if: matrix.julia == '1.12'
        shell: bash -el {0}
        run: |
          set -euo pipefail
          bash tools/build_static_curl.sh "$RUNNER_TEMP/curl"
          build="$RUNNER_TEMP/rumi-release-build"
          cmake -S core -B "$build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCURL_ROOT="$RUNNER_TEMP/curl" \
            -DCURL_DIR="$RUNNER_TEMP/curl/lib/cmake/CURL" \
            -DCURL_USE_STATIC_LIBS=TRUE \
            -DOPENSSL_ROOT_DIR="$CONDA_PREFIX" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DRUMI_BUILD_SHARED_LIB=ON
          cmake --build "$build" --target rumi --parallel 2
          library="$build/librumi.so"
          if readelf -d "$library" | grep -Eq 'lib(curl|ssl|crypto)'; then
            echo '::error::Julia artifact has a shared transport dependency'
            exit 1
          fi
          if nm -D --defined-only "$library" | awk '{print $3}' \
              | grep -Ev '^rumi_'; then
            echo '::error::Julia artifact exports a private dependency symbol'
            exit 1
          fi
          version="$(tr -d '[:space:]' < VERSION)"
          dist="$RUNNER_TEMP/rumi-artifact"
          package="$RUNNER_TEMP/Rumi-release"
          name="librumi-$version-linux-x86_64"
          mkdir -p "$dist/$name"
          cp -L "$library" "$dist/$name/"
          cp LICENSE NOTICE "$dist/$name/"
          cp -R licenses "$dist/$name/"
          tar -C "$dist" -czf "$dist/$name.tar.gz" "$name"
          cp -R bindings/julia "$package"
          export JULIA_DEPOT_PATH="$RUNNER_TEMP/rumi-julia-depot-${{ matrix.julia }}"
          julia bindings/julia/make-artifacts-toml.jl \
            "$version" "$dist" linux-x86_64 > "$package/Artifacts.toml"
          unset RUMI_LIB
          PACKAGE_PATH="$package" julia --startup-file=no --project="$package" -e '
            using Rumi
            root = ENV["PACKAGE_PATH"]
            header = Base.read(joinpath(root, "test", "fixtures", "binding.header"))
            file = Rumi.open(joinpath(root, "test", "fixtures", "binding.rumi"), header)
            @assert size(Rumi.read(file)) == (8, 6, 3, 2)
            @assert occursin("artifacts", Rumi._find_library())
            close(file)
          '

  julia-compat:
    name: Julia 1.10
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Init OpenZL dependencies
        run: |
          git -C extern/geozl submodule update --init extern/openzl
          git -C extern/geozl/extern/openzl submodule update --init deps/zstd deps/lz4
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: julia
          create-args: >-
            cmake
            ninja
            julia=1.10
            libcurl=8.22.0
            openssl=3.6.4
      - name: Test Julia reader
        shell: bash -el {0}
        run: |
          make build
          RUMI_LIB="$PWD/core/build/librumi.so" \
            julia --startup-file=no --project=bindings/julia \
              bindings/julia/test/runtests.jl

  r-windows:
    name: R (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: bindings/r
          extra-packages: any::roxygen2
      - name: Prepare R source package
        shell: bash
        run: |
          set -euo pipefail
          python tools/sync_r_vendor.py --check
          python - <<'PY'
          from pathlib import Path
          from shutil import copyfile

          Path("bindings/r/src/link.cpp").write_text('''#define R_NO_REMAP
          #include <Rinternals.h>
          #include <cstdio>
          #include "rumi/thread_pool.hpp"

          extern "C" SEXP rumi_r_shutdown_pool(void) {
              auto& global = rumi::detail::g_global_pool;
              auto* slot = global.current.exchange(nullptr, std::memory_order_acq_rel);
              std::fprintf(stderr, "pool shutdown begin %p\\n", static_cast<void*>(slot));
              std::fflush(stderr);
              if (slot && slot->owner == rumi::detail::current_pid()) delete slot;
              std::fprintf(stderr, "pool shutdown done\\n");
              std::fflush(stderr);
              return R_NilValue;
          }
          ''')
          path = Path("bindings/r/src/rumi_r.c")
          code = path.read_text()
          marker = 'SEXP rumi_r_geozl_compress(SEXP ptr, SEXP bytes, SEXP dtype_s);'
          assert code.count(marker) == 1
          code = code.replace(marker, marker + '\nSEXP rumi_r_shutdown_pool(void);')
          marker = '    {"rumi_r_geozl_compress", (DL_FUNC)&rumi_r_geozl_compress, 3},'
          assert code.count(marker) == 1
          path.write_text(code.replace(marker, marker + '\n    {"rumi_r_shutdown_pool", (DL_FUNC)&rumi_r_shutdown_pool, 0},'))
          Path("bindings/r/R/zzz.R").write_text('''.onLoad <- function(libname, pkgname) {
            reg.finalizer(asNamespace(pkgname), function(e) {
              cat("R exit hook begin\\n", file = stderr())
              if ("rumi" %in% names(getLoadedDLLs()))
                .Call(rumi_r_shutdown_pool)
              cat("R exit hook done\\n", file = stderr())
            }, onexit = TRUE)
          }

          .onUnload <- function(libpath) {
            cat("R unload hook begin\\n", file = stderr())
            .Call(rumi_r_shutdown_pool)
            cat("R unload hook done\\n", file = stderr())
          }
          ''')
          pool = Path("core/include/rumi/thread_pool.hpp")
          code = pool.read_text()
          old = '''inline ThreadPool::~ThreadPool()
          {
              {
                  std::lock_guard lock(mutex_);
                  stop_ = true;
              }
              ready_.notify_all();
              for (std::thread& w : workers_) {
                  if (w.joinable()) w.join();
              }
          }
          '''
          new = '''inline ThreadPool::~ThreadPool()
          {
              std::fprintf(stderr, "pool dtor begin\\n"); std::fflush(stderr);
              {
                  std::lock_guard lock(mutex_);
                  stop_ = true;
              }
              ready_.notify_all();
              for (std::thread& w : workers_) {
                  std::fprintf(stderr, "join begin\\n"); std::fflush(stderr);
                  if (w.joinable()) w.join();
                  std::fprintf(stderr, "join done\\n"); std::fflush(stderr);
              }
              std::fprintf(stderr, "pool dtor done\\n"); std::fflush(stderr);
          }
          '''
          assert code.count(old) == 1
          code = code.replace(old, new)
          code = code.replace('#include <condition_variable>\n', '#include <condition_variable>\n#include <cstdio>\n', 1)
          pool.write_text(code)
          plan = Path("core/src/plan.cpp")
          code = plan.read_text()
          marker = '// Decoder context and reusable buffers for one worker.\nstruct WorkerState {'
          assert code.count(marker) == 1
          code = code.replace(marker, 'std::mutex g_worker_state_free_mutex;\n\n' + marker)
          marker = '    WorkerState() {'
          assert code.count(marker) == 1
          code = code.replace(marker, marker + '\n        std::fprintf(stderr, "worker state create %p dctx %p\\n", static_cast<void*>(this), static_cast<void*>(dctx)); std::fflush(stderr);')
          old = '    ~WorkerState() { if (dctx) ZL_DCtx_free(dctx); }'
          new = '''    ~WorkerState() {
                  std::fprintf(stderr, "worker state free begin %p dctx %p\\n", static_cast<void*>(this), static_cast<void*>(dctx)); std::fflush(stderr);
                  std::lock_guard guard(g_worker_state_free_mutex);
                  if (dctx && !std::getenv("RUMI_TRACE_SKIP_DCTX_FREE")) ZL_DCtx_free(dctx);
                  std::fprintf(stderr, "worker state free done\\n"); std::fflush(stderr);
              }'''
          assert code.count(old) == 1
          code = code.replace(old, new)
          marker = '    WorkerState& ws = worker_state();'
          assert code.count(marker) == 1
          code = code.replace(marker, marker + '\n    std::fprintf(stderr, "worker state use %p dctx %p\\n", static_cast<void*>(&ws), static_cast<void*>(ws.dctx)); std::fflush(stderr);')
          plan.write_text(code)
          copyfile(pool, "bindings/r/src/ext/r/include/rumi/thread_pool.hpp")
          copyfile(plan, "bindings/r/src/ext/r/src/plan.cpp")
          PY
      - name: Install R package
        shell: bash
        run: R CMD INSTALL bindings/r
      - name: Trace R package exit
        id: r_load
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        run: Rscript -e 'library(rumi); cat("package loaded\n")'
      - name: Trace GeoZL test exit
        id: r_geozl
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        run: Rscript -e 'testthat::test_file("bindings/r/tests/testthat/test-geozl.R", reporter="progress"); cat("GeoZL tests done\n")'
      - name: Trace read test exit
        id: r_read
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        run: Rscript -e 'testthat::test_file("bindings/r/tests/testthat/test-read.R", reporter="progress"); cat("read tests done\n")'
      - name: Trace early pool shutdown
        id: r_early
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        run: Rscript -e 'testthat::test_file("bindings/r/tests/testthat/test-settings.R", reporter="progress"); evalq(.Call(rumi_r_shutdown_pool), asNamespace("rumi")); cat("early shutdown done\n")'
      - name: Trace settings exit without decoder free
        id: r_settings
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        env:
          RUMI_TRACE_SKIP_DCTX_FREE: '1'
        run: Rscript -e 'testthat::test_file("bindings/r/tests/testthat/test-settings.R", reporter="progress"); cat("settings tests done\n")'
      - name: Trace write test exit
        id: r_write
        shell: bash
        timeout-minutes: 3
        continue-on-error: true
        run: Rscript -e 'testthat::test_file("bindings/r/tests/testthat/test-write.R", reporter="progress"); cat("write tests done\n")'
      - name: Check source package
        if: steps.r_load.outcome == 'success' && steps.r_geozl.outcome == 'success' && steps.r_read.outcome == 'success' && steps.r_early.outcome == 'success' && steps.r_settings.outcome == 'success' && steps.r_write.outcome == 'success'
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          R CMD build bindings/r
          if ! _R_CHECK_CRAN_INCOMING_REMOTE_=false R CMD check --no-manual rumi_*.tar.gz; then
            test ! -f rumi.Rcheck/00install.out || cat rumi.Rcheck/00install.out
            exit 1
          fi
          sh tools/r_check_status.sh rumi.Rcheck/00check.log
      - name: Check R process exits
        if: always()
        shell: bash
        run: |
          test '${{ steps.r_load.outcome }}' = success
          test '${{ steps.r_geozl.outcome }}' = success
          test '${{ steps.r_read.outcome }}' = success
          test '${{ steps.r_early.outcome }}' = success
          test '${{ steps.r_settings.outcome }}' = success
          test '${{ steps.r_write.outcome }}' = success

  core:
    name: Core (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal
            sanitize: ""
            werror: ON
            cc: gcc
            cxx: g++
          - name: asan-ubsan
            sanitize: address,undefined
            werror: OFF
            cc: gcc
            cxx: g++
          - name: tsan
            sanitize: thread
            werror: OFF
            cc: gcc
            cxx: g++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Init OpenZL dependencies
        run: |
          git -C extern/geozl submodule update --init extern/openzl
          git -C extern/geozl/extern/openzl submodule update --init deps/zstd deps/lz4
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: build
          create-args: >-
            cmake
            ninja
      - name: Configure
        shell: bash -el {0}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S core -B core/build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCURL_ROOT="$CONDA_PREFIX"
          -DOPENSSL_ROOT_DIR="$CONDA_PREFIX"
          -DRUMI_BUILD_TESTS=ON
          -DRUMI_WERROR=${{ matrix.werror }}
          -DRUMI_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        shell: bash -el {0}
        run: cmake --build core/build-ci --parallel
      - name: Test
        shell: bash -el {0}
        run: ctest --test-dir core/build-ci --output-on-failure

  python-linux:
    name: Python ${{ matrix.python }} (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Init OpenZL dependencies
        run: |
          git -C extern/geozl submodule update --init extern/openzl
          git -C extern/geozl/extern/openzl submodule update --init deps/zstd deps/lz4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml
      - name: Install transport dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev
      - name: Check release metadata
        if: matrix.python == '3.12'
        run: python tools/check_release.py
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip cmake ninja
          python -m pip install numpy cffi pytest ruff mypy
      - name: Install PyTorch for fork integration
        if: matrix.python == '3.12'
        run: >-
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.*'
      - name: Install JAX and TensorFlow integrations
        if: matrix.python == '3.12'
        run: python -m pip install 'jax==0.11.2' 'tensorflow==2.21.0'
      - name: Build and install rumi
        run: make python
      - name: Lint
        if: matrix.python == '3.12'
        run: make lint
      # Compare rumi.geozl with the pinned GeoZL binding.
      - name: Run the Python suite
        run: make py-test
      - name: Run JAX x64 integration
        if: matrix.python == '3.12'
        env:
          JAX_ENABLE_X64: 'true'
        run: make py-test PYTEST_ARGS='-k jax_integration'
