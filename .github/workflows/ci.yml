name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: normal
            sanitize: ""
            werror: ON
            cc: gcc
            cxx: g++
          - name: asan-ubsan
            sanitize: address,undefined
            werror: OFF
            cc: gcc
            cxx: g++
          - name: tsan
            sanitize: thread
            werror: OFF
            cc: gcc
            cxx: g++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.KARU_DEPLOY_KEY }}
          submodules: true
          persist-credentials: false
      - name: Init OpenZL dependencies
        run: |
          git -C extern/geozl submodule update --init extern/openzl
          git -C extern/geozl/extern/openzl submodule update --init deps/zstd deps/lz4
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: build
          create-args: >-
            cmake
            ninja
      - name: Configure
        shell: bash -el {0}
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >-
          cmake -S core -B core/build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DRUMI_BUILD_TESTS=ON
          -DRUMI_WERROR=${{ matrix.werror }}
          -DRUMI_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        shell: bash -el {0}
        run: cmake --build core/build-ci --parallel
      - name: Test
        shell: bash -el {0}
        run: ctest --test-dir core/build-ci --output-on-failure

  python-linux:
    name: Python ${{ matrix.python }} (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.KARU_DEPLOY_KEY }}
          submodules: true
          persist-credentials: false
      - name: Init OpenZL dependencies
        run: |
          git -C extern/geozl submodule update --init extern/openzl
          git -C extern/geozl/extern/openzl submodule update --init deps/zstd deps/lz4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml
      - name: Install transport dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev
      - name: Check release metadata
        if: matrix.python == '3.12'
        run: python tools/check_release.py
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip cmake ninja
          python -m pip install numpy cffi pytest ruff mypy ml_dtypes "geozl>=0.16.0,<0.17"
      - name: Install PyTorch for fork integration
        if: matrix.python == '3.12'
        run: >-
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Build and install rumi
        run: make python
      - name: Lint
        if: matrix.python == '3.12'
        run: make lint
      - name: Run the Python suite
        run: python -m pytest bindings/python/tests -q
