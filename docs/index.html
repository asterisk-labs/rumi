<template id="view-home">
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-copy">
      <p class="eyebrow">Stateless raster storage for AI4EO</p>

      <h1 id="hero-title">Built for <span class="hero-line"><span class="hero-highlight">training data</span>.</span></h1>

      <p class="hero-summary">
        A simple raster format for AI, built on <a href="https://asterisk.coop/geozl/" rel="noopener noreferrer"><strong class="hero-summary-highlight">GeoZL</strong></a>, from storage to GPU tensor in one call.
      </p>

      <div class="install" data-copy-root>
        <div class="install-command">
          <span class="prompt" aria-hidden="true">$</span>
          <code>pip install rumi-eo</code>
          <button class="copy-command" type="button" data-copy="pip install rumi-eo" aria-label="Copy install command">
            <svg class="icon-copy" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h10v10H8z"></path><path d="M6 15H4V4h11v2"></path></svg>
            <svg class="icon-check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
            <span>Copy</span>
          </button>
        </div>
        <span class="copy-toast" aria-hidden="true">Copied</span>
        <p class="copy-feedback" aria-live="polite"></p>
      </div>

    </div>

    <figure class="reader" id="reader"
      data-label="One rumi.read into a PyTorch tensor on cuda:0. A window lifts one tile from four Sentinel-2 bands of Lake Annecy and its four compressed frames go into RAM. With CPU decode, OpenZL decodes them on the CPU into pinned memory and the decoded samples cross PCIe. With GPU decode, OpenZL only captures the payload, the compressed bytes cross PCIe and the PFOR and PivCo kernels expand them on the GPU. Both routes end in the same tensor, handed over through DLPack without a copy.">
    </figure>
    <p class="visually-hidden" id="reader-live" aria-live="polite"></p>
  </section>

</template>
