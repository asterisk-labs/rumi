  <span class="ambient-orb ambient-orb--violet"></span>
  <span class="ambient-orb ambient-orb--mint"></span>
  <canvas class="ambient-tiles" id="backdrop"></canvas>
</div>

<div class="page">
  <header class="masthead">
    <a class="wordmark" href="#/" aria-label="rumi home">

      </a>
      <a href="https://pypi.org/project/rumi-eo/" title="PyPI" aria-label="rumi on PyPI" rel="noopener noreferrer">
        <img src="assets/svg/pypi.svg" alt="" width="18" height="18">
      </a>
      <a href="https://asterisk.coop/geozl/" title="geozl" aria-label="geozl, the codec rumi compresses with" rel="noopener noreferrer">

      </a>
    </div>
  </header>

  <main id="view"></main>

  <footer class="colophon">
    <span>Made with</span>
    <span class="heart" aria-label="love" role="img"></span>
    <span>by</span>
    <a class="by" href="https://asterisk.coop" rel="noopener noreferrer">
      <img src="assets/svg/asterisk-mark.svg" alt="" width="15" height="17">
      <span>asterisk labs</span>
    </a>
  </footer>
</div>

<template id="view-home">
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-copy">
      <p class="eyebrow"><span aria-hidden="true"></span> GeoTIFF × OpenZL</p>

      <h1 id="hero-title">A GeoTIFF <span>for deep learning.</span></h1>

      <p class="hero-summary">
        Stateless reads. The header is predictable, so a tile offset is arithmetic, not a lookup.
      </p>

      <div class="install" data-copy-root>
        <div class="install-meta">
          <span>Install</span>
          <span class="install-status">Python package</span>
        </div>
        <div class="install-command">
          <span class="prompt" aria-hidden="true">$</span>
          <code>pip install rumi-eo geozl</code>
          <button class="copy-command" type="button" data-copy="pip install rumi-eo geozl" aria-label="Copy install command">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 8h10v10H8z"></path>
              <path d="M6 15H4V4h11v2"></path>
            </svg>
            <span>Copy</span>
          </button>
        </div>
        <p class="copy-feedback" aria-live="polite"></p>
      </div>

    </div>

    <figure class="file-card">
      <div class="file-card__label">
        <span>rumi.tif</span>
        <span class="file-card__state"><i aria-hidden="true"></i> stateless</span>
      </div>

      <div class="file-card__body">
        <div class="offsets" aria-hidden="true">
          <span>0</span>
          <span>16</span>
          <span>16 + 316 + values</span>
        </div>

        <div class="file-map" role="img" aria-label="A rumi file: a 16 byte GeoTIFF header, followed by an IFD of 316 bytes plus values, followed by tile payloads stored as OpenZL frames.">
          <div class="file-segment file-segment--geotiff">
            <span>GeoTIFF header</span>
            <small>16 B</small>
          </div>
          <div class="file-segment file-segment--ifd">
            <span>IFD</span>
            <small>316 B + values</small>
          </div>
          <div class="file-segment file-segment--tiles">
            <span>tile payloads</span>
            <small>one OpenZL frame each</small>
          </div>
        </div>

        <div class="file-groups" aria-hidden="true">
          <span>header</span>
          <span>pixels</span>
        </div>

        <div class="read-path">
          <div>
            <span>request</span>
            <strong>tile[n]</strong>
          </div>
          <span class="read-path__arrow" aria-hidden="true">→</span>
          <div>
            <span>offset</span>
            <strong>arithmetic</strong>
          </div>
          <span class="read-path__badge">no lookup</span>
        </div>
      </div>

      <figcaption>
        Predictable structure means direct access to the pixels you need.
      </figcaption>
    </figure>
  </section>
</template>
