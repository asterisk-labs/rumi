<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>rumi</title>
<meta name="description" content="A GeoTIFF-inspired raster format for deep learning.">

<link rel="icon" href="assets/svg/rumi-mark.svg">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/content.css">
</head>

<body>
<div class="ambient" aria-hidden="true">
  <span class="ambient-orb ambient-orb--violet"></span>
  <span class="ambient-orb ambient-orb--mint"></span>
  <canvas class="ambient-tiles" id="backdrop"></canvas>
</div>

<div class="page">
  <header class="masthead">
    <a class="wordmark" href="#/" aria-label="rumi home">
      <img src="assets/svg/rumi-mark.svg" alt="" width="40" height="40">
      <span>rumi</span>
    </a>

    <nav class="nav" aria-label="Primary navigation">
      <a href="#/why">why?</a>
      <a href="#/spec">spec</a>
      <a href="deck/">deck</a>
      <a href="#/documentation">documentation</a>
    </nav>

    <div class="offsite" aria-label="Project links">
      <a href="https://github.com/asterisk-labs/rumi" title="GitHub" aria-label="rumi on GitHub" rel="noopener noreferrer">
        <img src="assets/svg/github.svg" alt="" width="18" height="18">
      </a>
      <a href="https://pypi.org/project/rumi-eo/" title="PyPI" aria-label="rumi on PyPI" rel="noopener noreferrer">
        <img src="assets/svg/pypi.svg" alt="" width="18" height="18">
      </a>
      <a href="https://asterisk.coop/geozl/" title="geozl" aria-label="geozl, the codec rumi compresses with" rel="noopener noreferrer">
        <img src="assets/svg/geozl.svg" alt="" width="18" height="18">
      </a>
    </div>
  </header>

  <main id="view"></main>

  <footer class="colophon">
    <span>Made with</span>
    <span class="heart" aria-label="love" role="img"></span>
    <span>by</span>
    <a class="by" href="https://asterisk.coop" rel="noopener noreferrer">
      <img src="assets/svg/asterisk-mark.svg" alt="" width="15" height="17">
      <span>asterisk labs</span>
    </a>
  </footer>
</div>

<template id="view-home">
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-copy">
      <p class="eyebrow">GeoTIFF-inspired raster format</p>

      <h1 id="hero-title">Built for <span>deep learning.</span></h1>

      <p class="hero-summary">
        The rumi header maps every frame to its byte range for direct reads.
      </p>

      <div class="install" data-copy-root>
        <span class="install-label">Install</span>
        <div class="install-command">
          <span class="prompt" aria-hidden="true">$</span>
          <code>pip install "rumi-eo[write]"</code>
          <button class="copy-command" type="button" data-copy="pip install &quot;rumi-eo[write]&quot;" aria-label="Copy install command">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 8h10v10H8z"></path>
              <path d="M6 15H4V4h11v2"></path>
            </svg>
            <span>Copy</span>
          </button>
        </div>
        <p class="copy-feedback" aria-live="polite"></p>
      </div>

    </div>

    <figure class="rumi-flow" role="img" aria-label="A requested frame is located from the rumi header and read from the file.">
      <canvas id="rumi-flow" aria-hidden="true"></canvas>
      <figcaption>
        <span data-flow-step>request frame 17</span>
        <span>rumi header &rarr; byte offset &rarr; OpenZL frame</span>
      </figcaption>
    </figure>
  </section>
</template>

<template id="view-why">
  <section class="stub" aria-labelledby="why-title">
    <span class="stub-kicker">rumi / why?</span>
    <h1 id="why-title">why?</h1>
    <p>Content goes here.</p>
  </section>
</template>

<template id="view-spec">
  <section class="spec-page" aria-label="rumi specification">
    <header class="section-heading">
      <span class="stub-kicker">rumi / spec</span>
      <p>The normative format definition, generated from <code>SPEC.md</code>.</p>
    </header>

    <div class="spec-layout">
      <aside class="spec-sidebar" aria-label="Specification contents">
        <span>Contents</span>
        <!-- RUMI_SPEC_TOC_START -->
        <p>The table of contents is generated by <code>tools/build_docs.py</code>.</p>
        <!-- RUMI_SPEC_TOC_END -->
      </aside>

      <article class="spec-content">
        <!-- RUMI_SPEC_BODY_START -->
        <h1>rumi</h1>
        <p>Run <code>make docs</code> to render the current specification here.</p>
        <!-- RUMI_SPEC_BODY_END -->
      </article>
    </div>
  </section>
</template>

<template id="view-documentation">
  <section class="documentation-view" aria-labelledby="documentation-title">
    <header class="section-heading">
      <span class="stub-kicker">rumi / documentation</span>
      <h1 id="documentation-title">documentation</h1>
    </header>

    <div class="documentation-skeleton" aria-hidden="true">
      <aside class="skeleton-nav">
        <span class="skeleton-line skeleton-line--label"></span>
        <span class="skeleton-line"></span>
        <span class="skeleton-line skeleton-line--short"></span>
        <span class="skeleton-line skeleton-line--medium"></span>
        <span class="skeleton-line skeleton-line--short"></span>
      </aside>

      <div class="skeleton-content">
        <span class="skeleton-line skeleton-line--title"></span>
        <span class="skeleton-line skeleton-line--wide"></span>
        <span class="skeleton-line skeleton-line--wide"></span>
        <span class="skeleton-line skeleton-line--medium"></span>
        <span class="skeleton-block"></span>
      </div>
    </div>
    <span class="visually-hidden">Documentation coming soon.</span>
  </section>
</template>

<script src="assets/js/backdrop.js"></script>
<script src="assets/js/router.js"></script>
<script src="assets/js/flow.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
