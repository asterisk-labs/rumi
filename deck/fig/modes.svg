<path d="M601 49V359M677 49V359" fill="none" stroke="#BFB4F4" stroke-width="1" stroke-dasharray="3 4"/>
<text class="mono dim" x="214" y="74" font-size="14">HOST / RAM</text>
<text class="mono violet" x="639" y="74" font-size="14" text-anchor="middle">PCIe</text>
<text class="mono dim" x="696" y="74" font-size="14">GPU</text>

<text class="sans ink" x="42" y="152" font-size="30" font-weight="700">CPU</text>
<text class="mono dim" x="42" y="177" font-size="13">decode_backend="cpu"</text>
<text class="mono dim" x="218" y="111" font-size="13">SAME FOUR FRAMES</text>
