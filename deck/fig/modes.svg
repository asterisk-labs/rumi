<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Decode location determines the bytes crossing PCIe</title>
<desc id="desc">The same four compressed frame payloads can be decoded on the CPU before crossing PCIe, moving 524 kilobytes of samples, or moved compressed across PCIe and decoded on the GPU, moving 206 kilobytes. Both paths place the samples in the same CUDA tensor. Auto GPU decode applies to single-chunk PFOR or PivCo frames with one- or two-byte samples.</desc>
<defs>
  <pattern id="packed" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-1 7L7-1M3 10L10 3" fill="none" stroke="#F6B79F" stroke-width="1"/></pattern>
  <pattern id="pixels" width="17" height="17" patternUnits="userSpaceOnUse"><path d="M0 0H17M0 0V17" fill="none" stroke="#B8DEC2" stroke-width="1"/></pattern>
  <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#67707D" stroke-width="1.5"/></marker>
  <marker id="tip-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#4E04EB" stroke-width="1.5"/></marker>
</defs>
<style>
.sans{font-family:'League Spartan','Futura',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono','Cascadia Code',monospace}
.ink{fill:#17171B}.dim{fill:#667085}.violet{fill:#4E04EB}.orange{fill:#EE6539}.green{fill:#168C45}
</style>
