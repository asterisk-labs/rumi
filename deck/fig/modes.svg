  <text x="14" y="24">02</text><text x="42" y="24">03</text><text x="70" y="24">04</text><text x="98" y="24">08</text>
</g>
<path d="M330 155H350" fill="none" stroke="#67707D" stroke-width="1.8" marker-end="url(#tip)"/>
<text class="mono green" x="355" y="111" font-size="14" font-weight="700">DECODE ON CPU</text>
