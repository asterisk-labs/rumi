<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-label="The khipu data model. Rumi stores Images and temporal Cubes using tile or cell frames. Rumikuna groups Images and Cubes into collections.">
<style>
.mono{font-family:'Cascadia Code','Fira Code','Consolas',monospace;}
.sans{font-family:'League Spartan','Futura','Century Gothic',system-ui,sans-serif;}
</style>
<rect width="1000" height="500" fill="#FFFFFF"/>

<text class="sans" x="40" y="42" font-size="15" font-weight="700" fill="#1A1A1A">khipu</text>
<text class="sans" x="98" y="42" font-size="12.5" fill="#9CA3AF">the AI4EO data model</text>

<!-- Rumi stores one Image or temporal Cube per file. -->
<rect x="36" y="66" width="596" height="372" rx="14" fill="#F3FDF7" stroke="#86EFAC" stroke-width="1.4"/>
<text class="sans" x="58" y="104" font-size="22" font-weight="700" fill="#166534">rumi</text>
<text class="sans" x="58" y="124" font-size="12" fill="#16A34A">Image and temporal Cube files</text>
<text class="mono" x="64" y="153" font-size="10" fill="#6B7280">FRAME LAYOUTS</text>

<rect x="64" y="166" width="220" height="72" rx="9" fill="#F2C879" stroke="#9C6B16" stroke-width="1"/>
<text class="sans" x="174" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A">tile frame</text>
<text class="mono" x="174" y="216" text-anchor="middle" font-size="10.5" fill="#7C5E10">(h, w)</text>

<rect x="364" y="166" width="220" height="72" rx="9" fill="#F2C879" stroke="#9C6B16" stroke-width="1"/>
<text class="sans" x="474" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A">cell frame</text>
<text class="mono" x="474" y="216" text-anchor="middle" font-size="10.5" fill="#7C5E10">(B, h, w) or (T, B, h, w)</text>

<text class="mono" x="64" y="291" font-size="10" fill="#6B7280">FILE SHAPES</text>

<rect x="64" y="304" width="220" height="72" rx="9" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.2"/>
<text class="sans" x="174" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Image</text>
<text class="mono" x="174" y="354" text-anchor="middle" font-size="10.5" fill="#16A34A">(B, Y, X)</text>

<rect x="364" y="304" width="220" height="72" rx="9" fill="#ECFDF5" stroke="#16A34A" stroke-width="1.2"/>
<text class="sans" x="474" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">Cube</text>
<text class="mono" x="474" y="354" text-anchor="middle" font-size="10.5" fill="#16A34A">(T, B, Y, X)</text>

<!-- Rumikuna represents collections outside the Rumi file. -->
<rect x="648" y="66" width="316" height="372" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.4"/>
<text class="sans" x="668" y="104" font-size="22" font-weight="700" fill="#4E04EB">rumikuna</text>
<text class="sans" x="668" y="124" font-size="12" fill="#6D4AEF">collections across files</text>

<rect x="700" y="166" width="210" height="72" rx="9" fill="#EDE9FE" stroke="#4E04EB" stroke-width="1.2"/>
<text class="sans" x="805" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#4E04EB">ImageCollection</text>
<text class="mono" x="805" y="216" text-anchor="middle" font-size="10.5" fill="#6D4AEF">set of Images</text>

<rect x="700" y="304" width="210" height="72" rx="9" fill="#EDE9FE" stroke="#4E04EB" stroke-width="1.2"/>
<text class="sans" x="805" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#4E04EB">CubeCollection</text>
<text class="mono" x="805" y="354" text-anchor="middle" font-size="10.5" fill="#6D4AEF">set of Cubes</text>

<line x1="284" y1="340" x2="691" y2="202" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="4 3"/>
<path d="M698 200 L690 198 L693 206 Z" fill="#6B7280"/>
<line x1="584" y1="340" x2="691" y2="340" stroke="#6B7280" stroke-width="1.4" stroke-dasharray="4 3"/>
<path d="M698 340 L691 336 L691 344 Z" fill="#6B7280"/>

<text class="sans" x="500" y="472" text-anchor="middle" font-size="14" fill="#6B7280">Rumi stores Images and Cubes. Rumikuna groups them into collections.</text>
</svg>
