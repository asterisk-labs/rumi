<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">A loader caches a Parquet catalog and reads one of many Rumi files in Amazon S3</title>
<desc id="desc">A data loader caches a Parquet catalog with URI and EXTERNAL HEADER columns. One selected row identifies one Rumi object among many in Amazon S3, and its header gives the byte range for a range GET.</desc>
<!-- Apache Parquet mark: https://github.com/apache/parquet-format/blob/master/logo/parquet-logos_3.svg (Apache-2.0). -->
<!-- Amazon S3 icon: AWS Architecture Icons Q3 2026, https://aws.amazon.com/architecture/icons/. -->
