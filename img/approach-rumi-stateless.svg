<line x1="72" y1="325" x2="928" y2="325" stroke="#E5E7EB" stroke-width="1"/>
<text class="mono dim" x="86" y="351" font-size="12">SELECT</text>
<text class="mono ink" x="86" y="382" font-size="16">window, band, time → k</text>
<text class="mono dim" x="382" y="351" font-size="12">LOCATE</text>
<text class="mono ink" x="382" y="382" font-size="16">offset[k] = base + Σ size[0:k]</text>
<text class="mono dim" x="702" y="351" font-size="12">FETCH</text>
<text class="mono ink" x="702" y="382" font-size="16">GET range(offset[k], size[k])</text>
