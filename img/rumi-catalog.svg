<svg width="1000" viewBox="-20 0 1000 545" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">rumi.write returns the file and its header, and the headers become a table</title>
<desc id="d">An array goes into rumi.write and two artifacts come out: a .rumi file and its header. The header is a 26 byte record holding the image size, tile size, band count, dtype and the offset where frames begin, followed by the compressed size of every frame in wire order. One path plus one header is one row, so a million files are a million rows in a parquet catalog.</desc>
<style>
  .sans{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  .mono{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace}
  .ink{fill:#16181D} .muted{fill:#9AA0A6} .arr{color:#6B7280}
  .wire{stroke:#8493A8;fill:none} .hair{stroke:#C6CFDC;fill:none}
  .tvio{fill:#4A2BE8} .tyel{fill:#8A6D06}
  .boxv{fill:none;stroke:#4A2BE8;stroke-width:1.8}
  .boxy{fill:none;stroke:#C99A06;stroke-width:1.4}
  .fileg{stroke:#8493A8;stroke-width:1.4;fill:none;stroke-linejoin:round}
  .chead{fill:#F7CC0C} .cell5{font-size:10px;fill:#5B6470}
  .lab{font-size:12px} .sub{font-size:10px} .desc{font-size:9.5px;fill:#6B7280}
  .col{font-size:10px;letter-spacing:.6px}
  .big{font-size:20px;font-weight:700} .note{font-size:11px}
  .spark{stroke:#8B6BFF;stroke-width:2.5;fill:none;stroke-linecap:round;
    stroke-dasharray:30 260;animation:travel 2.6s linear infinite}
  .rows>g{animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.4}45%{opacity:1}}
  @keyframes travel{from{stroke-dashoffset:30}to{stroke-dashoffset:-230}}
  @media (prefers-color-scheme:dark){
    .ink{fill:#E6EDF3} .muted{fill:#8B949E} .arr{color:#8B949E}
    .wire,.fileg{stroke:#59677D} .hair{stroke:#39414E} .tyel{fill:#F7CC0C}
    .cell5{fill:#AAB4C0} .desc{fill:#8B949E}
  }
  @media (prefers-reduced-motion:reduce){.rows>g{animation:none;opacity:.9} .spark{display:none}}
</style>
