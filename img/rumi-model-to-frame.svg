<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360"
     viewBox="0 0 820 360" role="img" aria-labelledby="title desc">
  <title id="title">Relationship between tiles, cells, and frames</title>
  <desc id="desc">Tiles and cells belong to the raster data model. A frame is
  the compressed storage unit. It contains either one tile for one band and
  time step, or one cell at one grid position.</desc>
  <style>
    svg {
      --ink: #1f2328;
      --muted: #59636e;
      --rule: #d1d9e0;
      --accent: #4a2be8;
      --tile: #f1edff;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink: #e6edf3;
        --muted: #9198a1;
        --rule: #3d444d;
        --accent: #8b7cff;
        --tile: #272345;
      }
    }
    text {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial,
        sans-serif;
      fill: var(--ink);
    }
    .mono {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    .heading {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      fill: var(--muted);
    }
    .name { font-size: 17px; font-weight: 600; }
    .shape { font-size: 14px; fill: var(--muted); }
    .small { font-size: 12px; fill: var(--muted); }
    .tile {
      fill: var(--tile);
      stroke: var(--accent);
      stroke-width: 1.4;
    }
    .cell {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.4;
    }
    .frame {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.2;
      stroke-dasharray: 5 4;
    }
    .arrow {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.4;
      marker-end: url(#arrowhead);
    }
    .rule { stroke: var(--rule); stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7"
            refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="var(--muted)"/>
    </marker>
  </defs>

  <text class="heading" x="205" y="28" text-anchor="middle">DATA MODEL</text>
  <text class="heading" x="610" y="28" text-anchor="middle">COMPRESSED STORAGE</text>

  <!-- Tile mode. -->
  <text class="name" x="72" y="87">tile</text>
  <text class="mono shape" x="72" y="108">(h, w)</text>
  <rect class="tile" x="192" y="61" width="112" height="62" rx="3"/>
  <text class="mono shape" x="248" y="98" text-anchor="middle">h × w</text>

  <path class="arrow" d="M330 92 H444"/>

  <rect class="frame" x="468" y="50" width="280" height="84" rx="5"/>
  <text class="heading" x="482" y="69">FRAME</text>
  <rect class="tile" x="558" y="72" width="100" height="44" rx="3"/>
  <text class="small" x="608" y="99" text-anchor="middle">one tile</text>
  <text class="small" x="608" y="151" text-anchor="middle">
    selected by row, col, b, t
  </text>

  <line class="rule" x1="40" y1="178" x2="780" y2="178"/>

  <!-- Cell mode. -->
  <text class="name" x="72" y="229">cell</text>
  <text class="mono small" x="72" y="250">Image (B, h, w)</text>
  <text class="mono small" x="72" y="270">Cube (T, B, h, w)</text>

  <rect class="cell" x="230" y="205" width="96" height="78" rx="4"/>
  <text class="small" x="278" y="239" text-anchor="middle">all samples at</text>
  <text class="mono small" x="278" y="258" text-anchor="middle">(row, col)</text>

  <path class="arrow" d="M350 244 H444"/>

  <rect class="frame" x="468" y="202" width="280" height="84" rx="5"/>
  <text class="heading" x="482" y="221">FRAME</text>
  <rect class="cell" x="558" y="224" width="100" height="44" rx="3"/>
  <text class="small" x="608" y="251" text-anchor="middle">one cell</text>
  <text class="small" x="608" y="303" text-anchor="middle">
    selected by row, col
  </text>
</svg>
